server {
    listen 80;
    server_name _;
    
    root /usr/share/nginx/html;
    index index.html;
    
    # Blazor WASM fallback routing
    location / {
        try_files $uri $uri/ /index.html;
    }
    
    # 🔁 gRPC-Web proxy для auth-service (порт 5012!)
    location /AuthGrpcService {
        proxy_pass http://bytecode-auth:5012;
        proxy_http_version 1.1;
        
        # Обязательные заголовки для gRPC-Web
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Поддержка streaming и таймауты
        proxy_cache_bypass $http_upgrade;
        proxy_no_cache $http_upgrade;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        
        # Важно: не буферизировать ответы для streaming
        proxy_buffering off;
    }
    
    # 🔁 gRPC-Web proxy для bytecode-core-service
    location /CourseGrpcService {
        proxy_pass http://bytecode-core:5221;
        proxy_http_version 1.1;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        proxy_cache_bypass $http_upgrade;
        proxy_no_cache $http_upgrade;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }
    
    # Кэширование статики
    location ~* \.(wasm|js|css|png|jpg|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}