syntax = "proto3";
package AuthGrpcService;

import "google/protobuf/timestamp.proto";
import "google/protobuf/empty.proto";

option csharp_namespace = "AuthorizationService.Proto";

service AuthorizationService {
  rpc Login (LoginRequest) returns (LoginResponse);
  rpc RefreshToken (RefreshTokenRequest) returns (RefreshTokenResponse);
  rpc Logout (LogoutRequest) returns (LogoutResponse);
  // Создание пользователя
  rpc CreateUser(CreateUserRequest) returns (UserBooleanResponse);
  // Изменение пользовательских данных
  rpc UpdateUser(UpdateUserRequest) returns (UserBooleanResponse);
  // Получение пользователя
  rpc GetUser(GetUserRequest) returns (UserInfoResponse);
  rpc GetUserByEmail(GetUserByEmailRequest) returns (UserInfoResponse);
}

message CreateUserRequest{
  // Фамилия
  string surname = 1;
  // Имя
  string name = 2;
  // Никнейм
  string nickName = 3;
  // Почта
  string email = 4;
  // Пароль
  string password = 5;
}

message UpdateUserRequest{
  // Идентификатор пользователя
  string user_id = 1;
  // Фамилия
  optional string surname = 2;
  // Имя
  optional string name = 3;
  // Отчество
  optional string nickName = 4;
  // Почта
  optional string email = 5;
}

message GetUserRequest{
  // Идентификатор пользователя
  string user_id = 1;
}

message GetUserByEmailRequest{
  string user_email = 1;
}

message UserInfoResponse{
  string user_id = 1;
  string surname = 2;
  string name = 3;
  string nickname = 4;
  string email = 5;
  bool isAuthor = 6;
  google.protobuf.Timestamp createdAt = 7;
  optional google.protobuf.Timestamp updatedAt = 8;
  optional google.protobuf.Timestamp deletedAt = 9;
}

message UserBooleanResponse{
  bool success = 1;
}

message UserAuthorInfoResponse{
  string author_id = 1;
  UserInfoResponse user = 2;
}

message LoginRequest {
  string email = 1;
  string password = 2;
}

message LoginResponse {
  string access_token = 1;
  string refresh_token = 2;
  int32 expires_in = 3;
}

message RefreshTokenRequest {
  string refresh_token = 1;
}

message RefreshTokenResponse {
  string access_token = 1;
  string refresh_token = 2;
  int32 expires_in = 3;
}

message LogoutRequest {
  string refresh_token = 1;
}

message LogoutResponse {}