services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend
    ports:
      - "5000:80"
    depends_on:
      - api
    restart: unless-stopped